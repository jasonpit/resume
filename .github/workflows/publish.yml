name: Publish resume

on:
  push:
    branches: [main]
    paths:
      - 'resume.md'
      - 'skills.md'
      - 'assets/**'
      - 'templates/**'
      - 'build.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 fonts-liberation
          python3 -m pip install --upgrade pip
          python3 -m pip install weasyprint

      - name: Build
        run: ./build.sh

      - name: Upload site artifact (published)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The EU/DK variant carries the Danish language line and the relocation
      # note. It is deliberately NOT deployed to Pages — download it from this
      # run's artifacts and send it directly to EU employers.
      - name: Upload EU variant (not published)
        uses: actions/upload-artifact@v4
        with:
          name: resume-eu-variant
          path: _private/Jason_Pittman_Resume_EU.pdf
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
